[tools]
bun = "1.4.3"
cargo-insta = "1.49.0"
"github:sourcefrog/cargo-mutants" = "27.1.0"
rust = { version = "1.99.0", components = "rust-analyzer,clippy,rustfmt" }

[vars]
bundle = "bun build web/src/main.ts --outdir web/dist/assets --splitting --minify --format esm"

[tasks.web]
description = "Install the browser packages and bundle web/ into web/dist"
run = [
  "bun ci",
  "rm -rf web/dist",
  "{{vars.bundle}}",
  "cp web/index.html web/dist/index.html",
]

[tasks.dev]
description = "Rebuild web/dist on each change and run the server"
depends = ["web"]
run = "{{vars.bundle}} --watch & cargo run --"

[tasks.fmt]
run = "cargo fmt"

[tasks.lint]
run = ["cargo clippy --all-targets -- -D warnings", "bunx tsc"]

[tasks.test]
run = ["cargo test", "bun test --pass-with-no-tests"]

[tasks.check-dist]
description = "Fail if the committed web/dist is not what web/ builds"
depends = ["web"]
# git status, not git diff: a new chunk file is untracked and git diff misses it.
run = ["git status --short -- web/dist", "test -z \"$(git status --porcelain -- web/dist)\""]
