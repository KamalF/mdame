[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.34.0"
ci = "github"
installers = ["homebrew"]
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-musl", "x86_64-apple-darwin", "x86_64-unknown-linux-musl"]
hosting = "github"
# Files for the archives, beside LICENSE and README.md, which dist finds
include = ["NOTICE", "THIRD-PARTY-LICENSES-RUST.txt"]
# Steps before each build, from .github/build-setup.yml: they write the
# licence texts of the Rust crates
github-build-setup = "../build-setup.yml"
install-updater = false
tap = "KamalF/homebrew-tap"
publish-jobs = ["homebrew"]
post-announce-jobs = ["./check-release"]
# Provenance for the release archives: `gh attestation verify` checks it
github-attestations = true

# The actions of the release workflow, pinned by commit: a tag can move
[dist.github-action-commits]
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803" # v6.1.0
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8.0.2
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6" # v4.2.2
