name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: bun ci
      - run: mise run lint
      - run: mise run test
      - run: mise run check-dist
