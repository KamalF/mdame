test_tool = "nextest"
additional_cargo_test_args = ["--profile", "mutants"]

# Mutants that no test should catch. A run then shows only new gaps.
exclude_re = [
    # Start-up wiring: the manual checklist covers it.
    "replace main -> ExitCode",
    "replace run -> Result",
    "replace (config_dir|state_dir) ->",
    "replace print_urls with \\(\\)",
    # Lookup tables: a test would only repeat them.
    "delete match arm .* in (Family::of|image_type|content_type)",
    # A file that grows between its size check and its read: a race.
    "document.rs.*ErrorKind::FileTooLarge with (true|false) in view",
    "document.rs.*replace == with != in view",
    # Without this shortcut, the read stops at the limit with the same result.
    "size > RENDER_LIMIT with false in view",
    # On Linux it is false: the FSEvents branch runs on macOS only.
    "replace watches_whole_trees -> bool with false",
    # Watches every folder again on each walk: slower, with the same watches.
    "watch.rs:\\d+:30: replace && with \\|\\| in Folders::update",
    # The second walk closes a race between the walk and the watch: a test
    # needs that timing.
    "watch.rs:\\d+:16: delete ! in Folders::update",
    # For a write, the default arm gives the same answer, after a stat.
    "delete match arm EventKind::Modify\\(ModifyKind::Data\\(_\\)\\) in Folders::changed_by",
    # Needs the inotify watch limit reached.
    "denied\\(&error\\) with true in watch_folders",
    # Sends every class through the filter: the same names come out.
    "value.contains\\(\"mdame-\"\\) with true in no_app_names",
    # Any other read error comes back from the read after the link.
    "app.rs.*ErrorKind::NotFound with false in kept_token",
    # Needs a write error in a folder that private_folder just made
    # writable: a full disk.
    "app.rs.*ErrorKind::AlreadyExists with true in kept_token",
    # The .gitignore of a .mdame made a moment before: AlreadyExists needs
    # a race, another error a full disk.
    "history.rs.*ErrorKind::AlreadyExists with (true|false) in root",
    "history.rs.*replace == with != in root",
    # A retry that never ends: the tests hang, and only a timeout ends them.
    "history.rs.*ErrorKind::AlreadyExists with true in snapshot",
    "history.rs.*replace == with != in snapshot",
    "history.rs.*replace \\+= with \\*= in snapshot",
    # Needs another mdame to delete the snapshot between the listing and
    # the delete: a race.
    "history.rs.*ErrorKind::NotFound with false in prune",
    # cap-std lists only a folder that it can search, so the stat of an
    # entry fails only when another mdame pruned it since the listing. The
    # column keeps the guard of read_dir, which a test catches.
    "history.rs:\\d+:(27|40): .* in list$",
    # A theme deleted between its is_file check and its read: a race.
    "themes.rs.*ErrorKind::NotFound with false in read",
    # The life of a code ends at one instant: < and <= differ there only.
    "replace < with <= in open_code",
]
