# Called by release.yml once a release is published: installs it with
# Homebrew, on Linux and on macOS, and checks that mdame starts.
name: Check release

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read

jobs:
  check:
    # dist publishes no formula for a prerelease.
    if: ${{ !fromJson(inputs.plan).announcement_is_prerelease }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install with Homebrew
        run: |
          # On the Linux runner, brew is installed but not on PATH.
          test -x /home/linuxbrew/.linuxbrew/bin/brew && eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install KamalF/tap/mdame
          .github/check-release.sh "$(brew --prefix)/bin/mdame"
