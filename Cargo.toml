[package]
name = "mdame"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
cap-std = "4.0.3"
clap = { version = "4.6.7", features = ["derive"] }
comrak = { version = "0.56.0", default-features = false }
getrandom = "0.4.3"
ignore = "0.4.33"
open = "5.4.4"
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
insta = "1.49.0"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
