[tools]
bun = "1.4.3"
cargo-dist = "0.33.1"
cargo-insta = "1.49.0"
# No build for Intel macOS; the release workflow builds the same version:
# .github/build-setup.yml.
"github:EmbarkStudios/cargo-about" = { version = "0.9.3", os = ["linux"] }
# Mutation testing runs on Linux only: cargo-mutants has no build for ARM macOS.
"github:nextest-rs/nextest" = { version = "cargo-nextest-0.9.148", os = ["linux"] }
"github:sourcefrog/cargo-mutants" = { version = "27.1.0", os = ["linux"] }
rust = { version = "1.99.0", components = "rust-analyzer,clippy,rustfmt" }

[vars]
bundle = "bun build web/src/main.ts --outdir web/dist/assets --splitting --minify --format esm --external '*.woff2' --external '*.woff'"

[tasks.web]
description = "Install the browser packages and bundle web/ into web/dist, with their licence texts"
run = [
  "bun ci",
  "rm -rf web/dist",
  "mkdir -p target",
  "{{vars.bundle}} --metafile=target/web-meta.json",
  "cp web/index.html web/dist/index.html",
  "cp web/favicon.svg web/dist/assets/",
  "mkdir web/dist/assets/files",
  "cp node_modules/@fontsource-variable/ibm-plex-sans/files/*-wght-*.woff2 node_modules/@fontsource/ibm-plex-mono/files/*-400-*.woff2 web/dist/assets/files/",
  "mkdir web/dist/themes",
  "cp web/themes/light.css web/themes/dark.css web/dist/themes/",
  "bun web/notices.ts target/web-meta.json web/dist/assets/THIRD-PARTY-LICENSES.txt",
]

[tasks.dev]
description = "Rebuild web/dist on each change and run the server"
depends = ["web"]
run = "{{vars.bundle}} --watch & cargo run --"

[tasks.fmt]
run = "cargo fmt"

[tasks.lint]
run = ["cargo clippy --all-targets -- -D warnings", "bunx tsc"]

[tasks.test]
run = ["cargo test --no-fail-fast", "bun test --pass-with-no-tests"]

[tasks.check-dist]
description = "Fail if the committed web/dist is not what web/ builds"
depends = ["web"]
# git status, not git diff: a new chunk file is untracked and git diff misses it.
run = ["git status --short -- web/dist", "test -z \"$(git status --porcelain -- web/dist)\""]

[tasks.licenses]
description = "Write the licence texts of the Rust crates, as each release archive carries them"
run = "cargo about generate --locked --fail --output-file THIRD-PARTY-LICENSES-RUST.txt about.hbs"
