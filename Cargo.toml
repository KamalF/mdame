[package]
name = "mdame"
version = "0.1.0"
edition = "2024"

[dependencies]
ammonia = "4.2.4"
axum = { version = "0.8", features = ["ws"] }
cap-std = "4.0.3"
clap = { version = "4.6.7", features = ["derive"] }
comrak = { version = "0.56.0", default-features = false }
csv = "1.4.0"
getrandom = "0.4.3"
ignore = "0.4.33"
notify-debouncer-full = "0.7.0"
open = "5.4.4"
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "net", "sync"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
futures-util = "0.3.34"
insta = "1.49.0"
tempfile = "3.27.0"
tokio-tungstenite = "0.29.0"
tower = { version = "0.5.3", features = ["util"] }
